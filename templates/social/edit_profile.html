{% extends "base.html" %}{% block title %}Edit profile{% endblock %}{% block content %}<section class="formcard"><small>YOUR SPACE</small><h1>Edit profile</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}<label>First name<input name="first_name" value="{{ user.first_name }}"></label><label>Last name<input name="last_name" value="{{ user.last_name }}"></label><label>Bio<textarea name="bio" maxlength="160">{{ profile_obj.bio }}</textarea></label><label>Profile photo<input type="file" name="avatar" accept="image/*"></label><button class="btn">Save changes</button></form></section>{% endblock %}
