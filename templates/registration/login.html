{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}<section class="formcard auth"><div class="symbol">◎</div><small>WELCOME BACK</small><h1>Log in</h1>{% if form.errors %}<p class="error">Username or password incorrect. Try again.</p>{% endif %}<form method="post">{% csrf_token %}<label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Log in</button><input type="hidden" name="next" value="{{ next }}"></form><p>New here? <a href="{% url 'signup' %}">Create an account</a></p></section>{% endblock %}
